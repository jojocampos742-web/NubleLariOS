<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NubleLariOS</title>
<style>
:root{--a:#a855f7;--b:#6d28d9;--bg:#0a0714;--p:#150f26;--p2:#1e1636;--bd:#2d2250;--t:#f1ecff;--m:#9a8fc0;--g:#55e6a5;--r:#ff718b}
body.sing{--a:#fb923c;--b:#c2410c;--bg:#0f0a06;--p:#241508;--p2:#33200d;--bd:#4d3216;--m:#c0a58f}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--t);font:14px 'Segoe UI',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:var(--t)}button{cursor:pointer}.hid{display:none!important}
svg.lg{display:block}
#login{height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--a) 35%,transparent),transparent 50%),radial-gradient(circle at 80% 85%,color-mix(in srgb,var(--b) 40%,transparent),transparent 50%),var(--bg)}
.lbox{width:340px;background:var(--p);border:1px solid var(--bd);border-radius:20px;padding:30px;text-align:center}
.lbox svg{width:72px;margin:0 auto 10px}.lbox h1{margin:0 0 4px;font-size:24px}.lbox h1 span{color:var(--a)}.lbox p{color:var(--m);margin:0 0 18px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:none}input:focus,textarea:focus{border-color:var(--a)}
.lbox input{width:100%;margin-bottom:10px}
.btn{background:linear-gradient(120deg,var(--a),var(--b));border:0;border-radius:10px;padding:10px 14px;font-weight:600;color:#fff}.btn:disabled{opacity:.5}
.btn2{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}.btn2:hover{border-color:var(--a)}
#desk{position:fixed;inset:0 0 48px 0;background:radial-gradient(ellipse at 25% 15%,color-mix(in srgb,var(--a) 30%,transparent),transparent 55%),radial-gradient(ellipse at 85% 90%,color-mix(in srgb,var(--b) 40%,transparent),transparent 55%),var(--bg)}
#icons{display:flex;flex-direction:column;flex-wrap:wrap;height:100%;align-content:flex-start;gap:6px;padding:12px}
.di{width:84px;padding:8px 4px;text-align:center;border-radius:10px;cursor:pointer;font-size:12px}.di:hover{background:#ffffff18}.di i{display:block;font-style:normal;font-size:32px}
.win{position:absolute;display:flex;flex-direction:column;background:var(--p);border:1px solid var(--bd);border-radius:12px;box-shadow:0 20px 60px #0009;resize:both;overflow:hidden;min-width:260px;min-height:160px}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}.win.foc{border-color:var(--a)}
.tb{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--p2);cursor:move;touch-action:none}.tb b{flex:1;font-size:13px;font-weight:600}
.tb button{background:none;border:0;width:26px;height:22px;border-radius:6px}.tb button:hover{background:#ffffff22}.tb .x:hover{background:var(--r)}
.wb{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
#task{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--p);border-top:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:99999}
#sb{background:none;border:0;padding:4px;border-radius:8px}#sb:hover{background:#ffffff18}#sb svg{width:32px}
#tl{flex:1;display:flex;gap:4px;overflow:hidden}.tk{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tk.on{border-color:var(--a)}
#tray{display:flex;gap:12px;align-items:center;font-size:12px}#bal{cursor:pointer;color:var(--g);font-weight:600}
#start{position:fixed;left:8px;bottom:56px;width:300px;background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:10px;z-index:99999}
#start .u{padding:8px;border-bottom:1px solid var(--bd);margin-bottom:6px}#start .u small{color:var(--m);display:block}
.si{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px;border-radius:8px;text-align:left}.si:hover{background:#ffffff18}
.tm{background:#05030a;font:13px Consolas,monospace;padding:8px;flex:1;display:flex;flex-direction:column;min-height:0}.tm pre{margin:0;flex:1;overflow:auto;white-space:pre-wrap;color:#d9ccff;user-select:text}
.tm .in{display:flex}.tm .in input{flex:1;background:none;border:0;padding:0 0 0 4px;font:inherit}.tm .ps{color:var(--g)}
textarea.ed{flex:1;border:0;border-radius:0;resize:none;font:13px Consolas,monospace;tab-size:2}
.bar{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--bd);align-items:center}.bar input{flex:1}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;flex:1}.calc .dp{grid-column:1/5;background:var(--bg);border-radius:10px;padding:12px;text-align:right;font-size:26px;overflow:hidden}.calc button{background:var(--p2);border:1px solid var(--bd);border-radius:10px;font-size:18px}.calc button:hover{border-color:var(--a)}.calc .op{color:var(--a)}
.fl{flex:1;overflow:auto;padding:6px}.fi{display:flex;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer}.fi:hover{background:#ffffff14}.fi.sel{background:color-mix(in srgb,var(--a) 30%,transparent)}
.sth{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd)}.sth span{color:var(--g)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}.sc{background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}.sc .ic{font-size:30px}.sc small{color:var(--m);flex:1}
.pad{padding:14px;display:grid;gap:12px;align-content:start}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
canvas{background:#05030a;border-radius:8px;max-width:100%}
.tk2{display:flex;gap:8px;padding:6px;align-items:center}.tk2.d span{text-decoration:line-through;color:var(--m)}
#toast{position:fixed;right:14px;bottom:60px;display:grid;gap:8px;z-index:999999}.ts{background:var(--p2);border:1px solid var(--a);border-radius:10px;padding:10px 14px;max-width:280px}.ts small{display:block;color:var(--m)}
</style></head><body>
<div id="login"><form class="lbox" id="lf"><div id="llogo"></div><h1>Nuble<span>Lari</span>OS</h1><p>Entra com a tua conta do banco NubleLari</p>
<input id="lu" placeholder="Nome de utilizador" autocomplete="username"><input id="lp" type="password" placeholder="Palavra-passe" autocomplete="current-password"><button class="btn" style="width:100%" id="lb">Entrar</button></form></div>
<div id="os" class="hid"><div id="desk"><div id="icons"></div></div>
<div id="start" class="hid"></div>
<div id="task"><button id="sb"></button><div id="tl"></div><div id="tray"><span id="bal" title="Abrir a Store"></span><span id="clk"></span></div></div></div>
<div id="toast"></div>
<script>
const SU="https://itjfyixcrwvstncnoxts.supabase.co",SK="sb_publishable_Ne9bppUscqCxkvEvTzMIbw_3Oig9eil";
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=v=>String(v||"").trim().toLowerCase(),eur=v=>Number(v||0).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const LOGO='<svg class="lg" viewBox="0 0 512 512"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#lg)"/><ellipse cx="256" cy="256" rx="215" ry="85" transform="rotate(-18 256 256)" fill="none" stroke="#fff" stroke-width="30"/><circle cx="256" cy="256" r="95" fill="#08060f" stroke="#fff" stroke-width="22"/><circle cx="256" cy="256" r="30" fill="#e8e8e8"/></svg>';
$("#llogo").innerHTML=LOGO;$("#sb").innerHTML=LOGO;
async function sb(path,o={}){const h={apikey:SK,"Content-Type":"application/json"};if(o.prefer)h.Prefer=o.prefer;
 const r=await fetch(SU+"/rest/v1/"+path,{method:o.method||"GET",headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
 const t=await r.text();if(!r.ok)throw new Error(t||r.status);return t?JSON.parse(t):null}
async function hash(u,p){const d=new TextEncoder().encode("mindbank:"+norm(u)+":"+p);return[...new Uint8Array(await crypto.subtle.digest("SHA-256",d))].map(b=>b.toString(16).padStart(2,"0")).join("")}
function toast(t,m){const e=document.createElement("div");e.className="ts";e.innerHTML="<b>"+esc(t)+"</b><small>"+esc(m||"")+"</small>";$("#toast").append(e);setTimeout(()=>e.remove(),4000)}
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let U=null,own=new Set(),FS=null,wins=[],zi=10;
const UC="id,username,display_name,np,balance,frozen";

/* ---------- apps ---------- */
const APPS={
 term:{n:"Terminal",i:"⌨️",sys:1,w:580,h:360,f:appTerm},
 store:{n:"Store",i:"🛍️",sys:1,w:620,h:460,f:appStore},
 notes:{n:"Bloco de notas",i:"📝",sys:1,w:520,h:380,f:appNotes},
 files:{n:"Ficheiros",i:"📁",sys:1,w:560,h:400,f:appFiles},
 set:{n:"Definições",i:"⚙️",sys:1,w:480,h:420,f:appSet},
 calc:{n:"Calculadora",i:"🧮",sys:1,w:290,h:400,f:appCalc},
 web:{n:"Browser",i:"🌐",sys:1,w:820,h:520,f:appWeb},
 snake:{n:"Snake",i:"🐍",price:0,d:"Jogo clássico. Setas para mexer.",w:340,h:400,f:appSnake},
 tasks:{n:"Tarefas",i:"✅",price:0,d:"Lista de tarefas simples.",w:340,h:420,f:appTasks},
 paint:{n:"Paint",i:"🎨",price:4.5,d:"Desenha e guarda em PNG.",w:580,h:460,f:appPaint},
 code:{n:"Editor de Código",i:"💻",price:9.99,d:"Escreve e corre JavaScript.",w:640,h:460,f:appCode}
};
const installed=()=>Object.keys(APPS).filter(k=>APPS[k].sys||own.has(k));

/* ---------- janelas ---------- */
function openApp(k,arg){const a=APPS[k];if(!a||!(a.sys||own.has(k)))return toast("App não instalada","Instala-a na Store.");
 const el=document.createElement("div"),n=wins.length%8;el.className="win";
 el.style.cssText=`left:${90+n*28}px;top:${40+n*28}px;width:${Math.min(a.w,innerWidth-20)}px;height:${Math.min(a.h,innerHeight-70)}px`;
 el.innerHTML=`<div class="tb"><span>${a.i}</span><b>${a.n}</b><button class="mi">–</button><button class="mx">▢</button><button class="x">✕</button></div><div class="wb"></div>`;
 const w={el,k,cl:[],tk:document.createElement("button")};w.tk.className="tk";w.tk.textContent=a.i+" "+a.n;
 const foc=()=>{el.style.zIndex=++zi;el.classList.remove("hid");wins.forEach(x=>{x.el.classList.toggle("foc",x===w);x.tk.classList.toggle("on",x===w)})};w.foc=foc;
 const close=()=>{w.cl.forEach(f=>f());el.remove();w.tk.remove();wins=wins.filter(x=>x!==w)};
 el.onpointerdown=foc;
 w.tk.onclick=()=>{if(el.classList.contains("hid")||!el.classList.contains("foc"))foc();else el.classList.add("hid")};
 el.querySelector(".mi").onclick=()=>{el.classList.add("hid");w.tk.classList.remove("on")};
 el.querySelector(".mx").onclick=()=>el.classList.toggle("max");el.querySelector(".x").onclick=close;
 const tb=el.querySelector(".tb");tb.ondblclick=()=>el.classList.toggle("max");
 tb.onpointerdown=e=>{if(e.target.closest("button")||el.classList.contains("max"))return;const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
  const mv=v=>{el.style.left=Math.max(0,Math.min(innerWidth-60,v.clientX-dx))+"px";el.style.top=Math.max(0,Math.min(innerHeight-90,v.clientY-dy))+"px"};
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};addEventListener("pointermove",mv);addEventListener("pointerup",up)};
 $("#desk").append(el);$("#tl").append(w.tk);wins.push(w);foc();
 try{a.f(el.querySelector(".wb"),w,arg)}catch(e){console.error(e);el.querySelector(".wb").textContent="Erro na app: "+e.message}
 $("#start").classList.add("hid");return w}

/* ---------- ficheiros virtuais ---------- */
const fkey=()=>"nlos_fs_"+U.id,saveFS=()=>SS(fkey(),FS);
function initFS(){FS=LS(fkey(),null)||{t:"d",c:{Documentos:{t:"d",c:{"bem-vindo.txt":{t:"f",d:"Bem-vindo ao NubleLariOS!\nA tua conta é a do banco NubleLari."}}},Imagens:{t:"d",c:{}},Programas:{t:"d",c:{}}}}}
const rs=(p,cwd)=>{const o=p.startsWith("/")?[]:cwd.slice();p.split("/").forEach(s=>{if(!s||s===".")return;s===".."?o.pop():o.push(s)});return o};
const nd=ps=>{let n=FS;for(const s of ps){if(!n||n.t!=="d")return null;n=n.c[s]}return n||null};
function fsWrite(ps,d){const p=nd(ps.slice(0,-1));if(!p||p.t!=="d"||!ps.length)return false;p.c[ps[ps.length-1]]={t:"f",d};saveFS();return true}
function fsMk(ps){const p=nd(ps.slice(0,-1));if(!p||p.t!=="d"||!ps.length||p.c[ps[ps.length-1]])return false;p.c[ps[ps.length-1]]={t:"d",c:{}};saveFS();return true}
function fsRm(ps){const p=nd(ps.slice(0,-1));if(!p||!ps.length||!p.c[ps[ps.length-1]])return false;delete p.c[ps[ps.length-1]];saveFS();return true}

/* ---------- Terminal ---------- */
function appTerm(b,w){b.innerHTML='<div class="tm"><pre></pre><div class="in"><span class="ps"></span><input spellcheck="false" autocomplete="off"></div></div>';
 const out=b.querySelector("pre"),inp=b.querySelector("input"),ps=b.querySelector(".ps");let cwd=[],hs=[],hi=0;
 const pr=t=>{out.textContent+=t+"\n";out.scrollTop=1e9},upd=()=>ps.textContent=U.username+"@nuble:/"+cwd.join("/")+"$ ";upd();
 pr('NubleLariOS Terminal. Escreve "help".');b.onclick=()=>inp.focus();setTimeout(()=>inp.focus(),50);
 inp.onkeydown=async e=>{
  if(e.key==="ArrowUp"&&hs.length){hi=Math.max(0,hi-1);inp.value=hs[hi];e.preventDefault();return}
  if(e.key==="ArrowDown"){hi=Math.min(hs.length,hi+1);inp.value=hs[hi]||"";return}
  if(e.key!=="Enter")return;const line=inp.value.trim();inp.value="";pr(ps.textContent+line);if(!line)return;hs.push(line);hi=hs.length;
  let [c,...ar]=line.split(/\s+/);const rest=ar.join(" ");
  switch(c){
   case"help":pr("help ls cd pwd cat mkdir touch rm echo clear whoami date saldo apps open neofetch");break;
   case"ls":{const n=nd(ar[0]?rs(ar[0],cwd):cwd);n&&n.t==="d"?pr(Object.keys(n.c).map(k=>k+(n.c[k].t==="d"?"/":"")).join("  ")||"(vazio)"):pr("ls: pasta inválida");break}
   case"cd":{const p=rs(ar[0]||"/",cwd),n=nd(p);n&&n.t==="d"?(cwd=p,upd()):pr("cd: pasta não existe");break}
   case"pwd":pr("/"+cwd.join("/"));break;
   case"cat":{const n=nd(rs(ar[0]||"",cwd));n&&n.t==="f"?pr(n.d):pr("cat: ficheiro não existe");break}
   case"mkdir":fsMk(rs(ar[0]||"",cwd))||pr("mkdir: não foi possível");break;
   case"touch":{const p=rs(ar[0]||"",cwd);nd(p)||fsWrite(p,"")||pr("touch: não foi possível");break}
   case"rm":fsRm(rs(ar[0]||"",cwd))||pr("rm: não existe");break;
   case"echo":{const i=rest.indexOf(">");if(i<0)pr(rest);else fsWrite(rs(rest.slice(i+1).trim(),cwd),rest.slice(0,i).trim())||pr("echo: erro")}break;
   case"clear":out.textContent="";break;
   case"whoami":pr(U.username+" ("+U.display_name+") NP "+U.np);break;
   case"date":pr(new Date().toLocaleString("pt-PT"));break;
   case"saldo":await refreshBal();pr(eur(U.balance));break;
   case"apps":pr(installed().map(k=>k+" - "+APPS[k].n).join("\n"));break;
   case"open":APPS[ar[0]]?openApp(ar[0]):pr("open: app desconhecida (usa 'apps')");break;
   case"neofetch":pr("NubleLariOS 1.0\nUser: "+U.username+"\nApps: "+installed().length+"\nSaldo: "+eur(U.balance));break;
   default:pr(c+": comando não encontrado")}}}

/* ---------- Bloco de notas / Código ---------- */
function editor(b,w,arg,run){let path=arg||null;b.innerHTML=`<div class="bar"><button class="btn2" data-a="s">💾 Guardar</button>${run?'<button class="btn2" data-a="r">▶ Correr</button>':""}<span style="color:var(--m)" class="pt"></span></div><textarea class="ed" spellcheck="false"></textarea>${run?'<pre class="tm" style="flex:0 0 110px;margin:0;overflow:auto;white-space:pre-wrap"></pre>':""}`;
 const ta=b.querySelector("textarea"),pt=b.querySelector(".pt"),lab=()=>pt.textContent=path||"sem nome";lab();
 if(path){const n=nd(rs(path,[]));if(n&&n.t==="f")ta.value=n.d}
 const save=()=>{if(!path){const p=prompt("Guardar como (ex: /Documentos/nota"+(run?".js":".txt")+")","/Documentos/nota"+(run?".js":".txt"));if(!p)return;path=p}
  fsWrite(rs(path,[]),ta.value)?(toast("Guardado",path),lab()):(toast("Erro","A pasta não existe."),path=null)};
 ta.onkeydown=e=>{if(e.ctrlKey&&e.key==="s"){e.preventDefault();save()}};
 b.querySelector('[data-a="s"]').onclick=save;
 if(run)b.querySelector('[data-a="r"]').onclick=()=>{const o=b.querySelector("pre");o.textContent="";const lg=(...a)=>o.textContent+=a.map(x=>typeof x==="object"?JSON.stringify(x):x).join(" ")+"\n";
  try{const r=new Function("console",ta.value)({log:lg,error:lg,warn:lg});if(r!==undefined)lg("→",r)}catch(e){lg("Erro:",e.message)}}}
function appNotes(b,w,arg){editor(b,w,arg,false)}function appCode(b,w,arg){editor(b,w,arg,true)}

/* ---------- Explorador ---------- */
function appFiles(b,w){let cwd=[],sel=null;
 const draw=()=>{const n=nd(cwd);b.innerHTML=`<div class="bar"><button class="btn2" data-a="u">⬆</button><input readonly value="/${esc(cwd.join("/"))}"><button class="btn2" data-a="f">+ Pasta</button><button class="btn2" data-a="n">+ Ficheiro</button><button class="btn2" data-a="d">🗑</button></div><div class="fl">`+
  (Object.keys(n.c).sort().map(k=>`<div class="fi${sel===k?" sel":""}" data-k="${esc(k)}"><span>${n.c[k].t==="d"?"📁":"📄"}</span>${esc(k)}</div>`).join("")||'<div style="color:var(--m);padding:10px">Pasta vazia</div>')+"</div>";
  b.querySelectorAll(".fi").forEach(e=>{e.onclick=()=>{sel=e.dataset.k;draw()};e.ondblclick=()=>{const k=e.dataset.k;if(n.c[k].t==="d"){cwd.push(k);sel=null;draw()}else openApp(k.endsWith(".js")&&own.has("code")?"code":"notes","/"+[...cwd,k].join("/"))}});
  b.querySelector('[data-a="u"]').onclick=()=>{cwd.pop();sel=null;draw()};
  b.querySelector('[data-a="f"]').onclick=()=>{const s=prompt("Nome da pasta:");s&&!fsMk([...cwd,s])&&toast("Erro","Nome inválido ou já existe.");draw()};
  b.querySelector('[data-a="n"]').onclick=()=>{const s=prompt("Nome do ficheiro:","novo.txt");s&&(nd([...cwd,s])||fsWrite([...cwd,s],""));draw()};
  b.querySelector('[data-a="d"]').onclick=()=>{if(sel&&confirm("Apagar "+sel+"?")){fsRm([...cwd,sel]);sel=null;draw()}}};draw()}

/* ---------- Calculadora ---------- */
function appCalc(b){b.innerHTML='<div class="calc"><div class="dp">0</div></div>';const g=b.firstChild,dp=g.firstChild;let e="";
 "C ( ) ÷ 7 8 9 × 4 5 6 − 1 2 3 + 0 . ⌫ =".split(" ").forEach(k=>{const x=document.createElement("button");x.textContent=k;if("÷×−+=".includes(k))x.className="op";
  x.onclick=()=>{if(k==="C")e="";else if(k==="⌫")e=e.slice(0,-1);else if(k==="="){try{const s=e.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-");if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;e=String(+(Function('"use strict";return('+s+")")()).toFixed(10))}catch{e="Erro"}}else{if(e==="Erro")e="";e+=k}dp.textContent=e||"0"};g.append(x)})}

/* ---------- Browser ---------- */
function appWeb(b){const home='<body style="font-family:sans-serif;background:#120c22;color:#eee;text-align:center;padding:40px"><h1>🌐 NubleLari Browser</h1><p>Escreve um endereço ou pesquisa na barra acima.</p><p><a style="color:#c084fc" href="https://pt.wikipedia.org">Wikipédia</a> · <a style="color:#c084fc" href="https://www.openstreetmap.org">OpenStreetMap</a> · <a style="color:#c084fc" href="https://archive.org">Archive.org</a></p><p style="color:#999;font-size:12px">Alguns sites recusam abrir dentro de janelas. Usa ↗ para os abrir num separador novo.</p></body>';
 b.innerHTML='<div class="bar"><button class="btn2" data-a="h">🏠</button><input placeholder="Endereço ou pesquisa"><button class="btn2" data-a="g">Ir</button><button class="btn2" data-a="o" title="Abrir num separador novo">↗</button></div><iframe style="flex:1;border:0;background:#fff" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>';
 const f=b.querySelector("iframe"),i=b.querySelector("input");f.srcdoc=home;
 const url=()=>{const v=i.value.trim();if(!v)return"";if(/^https?:\/\//i.test(v))return v;if(!/\s/.test(v)&&/\.[a-z]{2,}/i.test(v))return"https://"+v;return"https://pt.wikipedia.org/w/index.php?search="+encodeURIComponent(v)};
 const go=()=>{const u=url();if(u)f.removeAttribute("srcdoc"),f.src=u};
 i.onkeydown=e=>e.key==="Enter"&&go();b.querySelector('[data-a="g"]').onclick=go;
 b.querySelector('[data-a="h"]').onclick=()=>{f.removeAttribute("src");f.srcdoc=home;i.value=""};
 b.querySelector('[data-a="o"]').onclick=()=>{const u=url();u&&open(u,"_blank","noopener")}}

/* ---------- Snake ---------- */
function appSnake(b,w){b.innerHTML='<div class="bar"><b class="sc2">Pontos: 0</b><button class="btn2" data-a="r">Reiniciar</button></div><canvas width="300" height="300" style="margin:10px auto"></canvas>';
 const c=b.querySelector("canvas"),x=c.getContext("2d"),S=15,N=20;let s,d,f,pts,dead,t;
 const rst=()=>{s=[{x:10,y:10}];d={x:1,y:0};pts=0;dead=false;food();b.querySelector(".sc2").textContent="Pontos: 0"},food=()=>{do f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(s.some(p=>p.x===f.x&&p.y===f.y))};
 const tick=()=>{if(dead)return;const h={x:(s[0].x+d.x+N)%N,y:(s[0].y+d.y+N)%N};if(s.some(p=>p.x===h.x&&p.y===h.y)){dead=true}else{s.unshift(h);h.x===f.x&&h.y===f.y?(pts++,food(),b.querySelector(".sc2").textContent="Pontos: "+pts):s.pop()}
  x.fillStyle="#05030a";x.fillRect(0,0,300,300);x.fillStyle="#ff718b";x.fillRect(f.x*S,f.y*S,S-1,S-1);x.fillStyle=getComputedStyle(document.body).getPropertyValue("--a");s.forEach(p=>x.fillRect(p.x*S,p.y*S,S-1,S-1));
  if(dead){x.fillStyle="#fff";x.font="22px sans-serif";x.fillText("Fim de jogo",95,155)}};
 const key=e=>{if(!w.el.classList.contains("foc"))return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();if(m[0]!==-d.x||m[1]!==-d.y)d={x:m[0],y:m[1]}}};
 addEventListener("keydown",key);t=setInterval(tick,110);w.cl.push(()=>{clearInterval(t);removeEventListener("keydown",key)});b.querySelector('[data-a="r"]').onclick=rst;rst()}

/* ---------- Tarefas ---------- */
function appTasks(b){const k="nlos_tasks_"+U.id;let L=LS(k,[]);const draw=()=>{b.innerHTML='<div class="bar"><input placeholder="Nova tarefa"><button class="btn2">+</button></div><div class="fl">'+L.map((t,i)=>`<div class="tk2${t.d?" d":""}"><input type="checkbox" data-i="${i}" ${t.d?"checked":""}><span style="flex:1">${esc(t.t)}</span><button class="btn2" data-x="${i}">✕</button></div>`).join("")+"</div>";
 const add=()=>{const v=b.querySelector("input").value.trim();v&&(L.push({t:v,d:false}),SS(k,L),draw())};b.querySelector(".bar button").onclick=add;b.querySelector(".bar input").onkeydown=e=>e.key==="Enter"&&add();
 b.querySelectorAll("[data-i]").forEach(e=>e.onchange=()=>{L[e.dataset.i].d=e.checked;SS(k,L);draw()});b.querySelectorAll("[data-x]").forEach(e=>e.onclick=()=>{L.splice(e.dataset.x,1);SS(k,L);draw()})};draw()}

/* ---------- Paint ---------- */
function appPaint(b){b.innerHTML='<div class="bar"><input type="color" value="#a855f7" style="padding:2px;width:44px"><input type="range" min="1" max="30" value="4" style="flex:0 0 100px"><button class="btn2" data-a="c">Limpar</button><button class="btn2" data-a="s">Guardar PNG</button></div><div style="padding:8px;overflow:auto"><canvas width="520" height="340" style="touch-action:none;cursor:crosshair"></canvas></div>';
 const c=b.querySelector("canvas"),x=c.getContext("2d"),col=b.querySelector('[type=color]'),sz=b.querySelector('[type=range]');let on=false;x.fillStyle="#fff";x.fillRect(0,0,520,340);x.lineCap="round";
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*520/r.width,(e.clientY-r.top)*340/r.height]};
 c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);x.strokeStyle=col.value;x.lineWidth=sz.value;x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(on){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>on=false;
 b.querySelector('[data-a="c"]').onclick=()=>{x.fillStyle="#fff";x.fillRect(0,0,520,340)};
 b.querySelector('[data-a="s"]').onclick=()=>{const a=document.createElement("a");a.href=c.toDataURL();a.download="desenho.png";a.click()}}

/* ---------- Definições ---------- */
function appSet(b){const th=localStorage.getItem("nlos_theme")||"neb";
 b.innerHTML=`<div class="pad"><h3 style="margin:0">Conta</h3><div>${esc(U.display_name)} (@${esc(U.username)})<br><small style="color:var(--m)">NP: ${esc(U.np)} · Saldo: ${eur(U.balance)}</small></div>
 <h3 style="margin:0">Tema</h3><div class="row"><button class="btn2" data-t="neb">🟣 Nebulosa</button><button class="btn2" data-t="sing">🟠 Singularidade</button></div>
 <h3 style="margin:0">Sistema</h3><div class="row"><button class="btn2" data-a="rf">Repor ficheiros</button><button class="btn2" data-a="lo">Terminar sessão</button></div><small style="color:var(--m)">NubleLariOS 1.0 · Supabase ligado ao banco</small></div>`;
 b.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>setTheme(e.dataset.t));
 b.querySelector('[data-a="rf"]').onclick=()=>{if(confirm("Apagar todos os teus ficheiros do OS?")){localStorage.removeItem(fkey());initFS();toast("Feito","Ficheiros repostos.")}};
 b.querySelector('[data-a="lo"]').onclick=logout}
function setTheme(t){document.body.classList.toggle("sing",t==="sing");localStorage.setItem("nlos_theme",t)}

/* ---------- Store ---------- */
function appStore(b){const draw=()=>{b.innerHTML=`<div class="sth"><b>🛍️ Store NubleLariOS</b><span>Saldo: ${eur(U.balance)}</span></div><div class="sg">`+
  Object.keys(APPS).filter(k=>!APPS[k].sys).map(k=>{const a=APPS[k],o=own.has(k);return`<div class="sc"><div class="ic">${a.i}</div><b>${a.n}</b><small>${a.d}</small><button class="btn" data-k="${k}" ${o?"disabled":""}>${o?"Instalada":a.price?eur(a.price):"Grátis"}</button></div>`}).join("")+"</div>";
  b.querySelectorAll("[data-k]").forEach(x=>x.onclick=async()=>{x.disabled=true;await buy(x.dataset.k);draw()})};
 draw();refreshBal().then(draw)}
async function buy(k){const a=APPS[k];
 try{
  if(a.price>0){
   const r=await sb("users?id=eq."+encodeURIComponent(U.id)+"&select=balance,frozen&limit=1"),c=r&&r[0];if(!c)throw Error("conta");
   if(c.frozen)return toast("Conta congelada","Não podes comprar.");
   const bal=Number(c.balance);if(bal+1e-6<a.price)return toast("Saldo insuficiente","Tens "+eur(bal)+".");
   const nb=Math.round((bal-a.price)*100)/100;
   const up=await sb("users?id=eq."+encodeURIComponent(U.id)+"&balance=eq."+c.balance,{method:"PATCH",body:{balance:nb},prefer:"return=representation"});
   if(!up||!up.length)return toast("Tenta outra vez","O saldo mudou durante a compra.");
   U.balance=nb;setBal();
   await sb("transactions",{method:"POST",body:{id:uid(),user_id:U.id,kind:"outgoing",amount:a.price,other_name:"NubleLariOS Store",description:"App: "+a.n,date:new Date().toISOString()},prefer:"return=minimal"}).catch(e=>console.error(e));
   await sb("notifications",{method:"POST",body:{id:uid(),user_id:U.id,title:"Compra na Store",message:a.n+" por "+eur(a.price),type:"info",read:false,date:new Date().toISOString()},prefer:"return=minimal"}).catch(()=>{})}
  own.add(k);SS("nlos_own_"+U.id,[...own]);
  sb("os_purchases",{method:"POST",body:{user_id:U.id,app_id:k,price:a.price,date:new Date().toISOString()},prefer:"return=minimal"}).catch(()=>{});
  toast("Instalada",a.n);renderDesk()
 }catch(e){console.error(e);toast("Erro","Não foi possível concluir. Tenta outra vez.")}}

/* ---------- sistema ---------- */
function setBal(){$("#bal").textContent=eur(U.balance)}
async function refreshBal(){try{const r=await sb("users?id=eq."+encodeURIComponent(U.id)+"&select="+UC+"&limit=1");if(r&&r[0]){Object.assign(U,r[0]);setBal()}else if(r&&!r.length)logout()}catch(e){console.error(e)}}
function renderDesk(){const ks=installed();$("#icons").innerHTML=ks.map(k=>`<div class="di" data-k="${k}"><i>${APPS[k].i}</i>${APPS[k].n}</div>`).join("");
 $("#icons").querySelectorAll(".di").forEach(e=>e.ondblclick=()=>openApp(e.dataset.k));
 $("#start").innerHTML=`<div class="u"><b>${esc(U.display_name)}</b><small>@${esc(U.username)} · NP ${esc(U.np)}</small></div>`+ks.map(k=>`<button class="si" data-k="${k}"><span>${APPS[k].i}</span>${APPS[k].n}</button>`).join("")+'<button class="si" data-k="_out"><span>⏻</span>Terminar sessão</button>';
 $("#start").querySelectorAll(".si").forEach(e=>e.onclick=()=>e.dataset.k==="_out"?logout():openApp(e.dataset.k))}
async function startOS(u){U=u;localStorage.setItem("nlos_session",U.id);initFS();
 own=new Set(LS("nlos_own_"+U.id,[]));try{const r=await sb("os_purchases?user_id=eq."+encodeURIComponent(U.id)+"&select=app_id");r&&r.forEach(x=>own.add(x.app_id))}catch{}
 [...own].forEach(k=>APPS[k]||own.delete(k));
 $("#login").classList.add("hid");$("#os").classList.remove("hid");setBal();renderDesk();
 openApp("store");
 clearInterval(window.pt);window.pt=setInterval(refreshBal,20000)}
function logout(){clearInterval(window.pt);localStorage.removeItem("nlos_session");wins.slice().forEach(w=>w.el.querySelector(".x").click());U=null;$("#os").classList.add("hid");$("#login").classList.remove("hid");$("#lp").value=""}
$("#lf").onsubmit=async e=>{e.preventDefault();const u=$("#lu").value.trim(),p=$("#lp").value;if(!u||!p)return;$("#lb").disabled=true;
 try{const r=await sb("users?username_lower=eq."+encodeURIComponent(norm(u))+"&select="+UC+",password_hash&limit=1"),row=r&&r[0];
  if(!row||row.password_hash!==await hash(u,p))toast("Não foi possível entrar","Confirma o utilizador e a palavra-passe.");
  else{delete row.password_hash;await startOS(row)}
 }catch(err){console.error(err);toast("Erro de ligação","Não foi possível falar com o Supabase.")}finally{$("#lb").disabled=false}};
$("#sb").onclick=e=>{e.stopPropagation();$("#start").classList.toggle("hid")};
$("#start").onclick=e=>e.stopPropagation();$("#desk").onclick=()=>$("#start").classList.add("hid");
$("#bal").onclick=()=>openApp("store");
setInterval(()=>$("#clk").textContent=new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}),1000);
setTheme(localStorage.getItem("nlos_theme")||"neb");
(async()=>{const id=localStorage.getItem("nlos_session");if(!id)return;try{const r=await sb("users?id=eq."+encodeURIComponent(id)+"&select="+UC+"&limit=1");r&&r[0]&&await startOS(r[0])}catch{}})();
</script></body></html>
